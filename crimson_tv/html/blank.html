<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crimson_tv menu</title>
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --panel-width: 382px;
            --panel-border: rgba(216, 185, 111, 0.32);
            --item-border: rgba(255, 255, 255, 0.04);
            --item-active-bg: linear-gradient(135deg, rgba(112, 88, 41, 0.38), rgba(36, 30, 18, 0.95));
            --item-active-border: rgba(231, 201, 131, 0.82);
            --text-main: rgba(245, 242, 235, 0.96);
            --text-soft: rgba(196, 193, 186, 0.88);
            --text-muted: rgba(152, 149, 143, 0.86);
            --accent: #d7b06a;
            --accent-strong: #f0d59b;
            --shadow: 0 18px 45px rgba(0, 0, 0, 0.36);
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            color: var(--text-main);
            user-select: none;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        #tv-menu-root {
            position: fixed;
            inset: 0;
            pointer-events: auto;
        }

        #tv-menu-root.hidden {
            display: none;
        }

        #tv-menu-panel {
            position: absolute;
            top: 66%;
            right: 8px;
            left: auto;
            width: var(--panel-width);
            transform: translateY(-50%);
            pointer-events: auto;
            background:
                radial-gradient(circle at top, rgba(248, 222, 165, 0.12), transparent 44%),
                linear-gradient(180deg, rgba(33, 35, 43, 0.98), rgba(17, 18, 23, 0.94));
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        #tv-menu-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            pointer-events: none;
        }

        .tv-menu-header {
            position: relative;
            padding: 18px 24px 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0));
        }

        .tv-menu-header::after {
            content: "";
            position: absolute;
            left: 24px;
            right: 24px;
            bottom: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(231, 201, 131, 0.85), transparent);
        }

        .tv-menu-kicker {
            margin-bottom: 6px;
            color: var(--accent);
            font-size: 10px;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            opacity: 0.92;
        }

        .tv-menu-title {
            font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #f4f0e8;
        }

        .tv-menu-items {
            padding: 10px;
        }

        .tv-menu-item {
            position: relative;
            width: 100%;
            min-height: 60px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border: 1px solid var(--item-border);
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.04));
            color: var(--text-main);
            transition: background 120ms ease, border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }

        .tv-menu-item + .tv-menu-item {
            margin-top: 8px;
        }

        .tv-menu-item:hover {
            border-color: rgba(217, 176, 106, 0.38);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.05));
        }

        .tv-menu-item.is-selected {
            background: var(--item-active-bg);
            border-color: var(--item-active-border);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 22px rgba(197, 152, 73, 0.14);
            transform: translateY(-1px);
        }

        .tv-menu-item.is-selected::before {
            content: "";
            position: absolute;
            left: 0;
            top: 11px;
            bottom: 11px;
            width: 3px;
            border-radius: 0 2px 2px 0;
            background: linear-gradient(180deg, var(--accent-strong), var(--accent));
        }

        .tv-menu-item.is-disabled {
            opacity: 0.64;
        }

        .tv-menu-item-main {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .tv-menu-item-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.2;
        }

        .tv-menu-item-meta {
            margin-bottom: 4px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .tv-menu-hint {
            position: absolute;
            top: calc(66% + 230px);
            right: 70px;
            left: auto;
            width: 252px;
            padding: 10px 14px;
            transform: none;
            border: 1px solid rgba(217, 176, 106, 0.22);
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(20, 22, 28, 0.92), rgba(15, 16, 21, 0.9));
            color: rgba(212, 217, 226, 0.88);
            font-size: 12px;
            text-align: center;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.26);
            pointer-events: none;
        }
    </style>
</head>
<body>
        <div id="tv-menu-root" class="hidden">
            <div id="tv-menu-panel">
                <div class="tv-menu-header">
                    <div id="tv-menu-kicker" class="tv-menu-kicker">CRIMSON EMPIRE</div>
                    <div id="tv-menu-title" class="tv-menu-title">CRIMSON TV</div>
                </div>
                <div id="tv-menu-items" class="tv-menu-items"></div>
        </div>
        <div id="tv-menu-hint" class="tv-menu-hint"></div>
    </div>
    <script>
        var root = document.getElementById('tv-menu-root');
        var panel = document.getElementById('tv-menu-panel');
        var kicker = document.getElementById('tv-menu-kicker');
        var title = document.getElementById('tv-menu-title');
        var itemsContainer = document.getElementById('tv-menu-items');
        var hint = document.getElementById('tv-menu-hint');

        var defaultBranding = {
            Kicker: 'CRIMSON EMPIRE',
            Title: 'CRIMSON TV',
            Layout: {
                Panel: {
                    Top: '66%',
                    Right: '8px',
                    Left: 'auto',
                    Transform: 'translateY(-50%)',
                },
                Hint: {
                    Top: 'calc(66% + 230px)',
                    Right: '70px',
                    Left: 'auto',
                    Width: '252px',
                    Transform: 'none',
                },
            },
        };

        var state = {
            open: false,
            title: defaultBranding.Title,
            items: [],
            selected: 0,
        };

        var resourceName = 'crimson_tv';

        if (typeof GetParentResourceName === 'function') {
            resourceName = GetParentResourceName();
        }

        function post(eventName, data) {
            fetch('https://' + resourceName + '/' + eventName, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json; charset=UTF-8',
                },
                body: JSON.stringify(data || {}),
            }).catch(function() {});
        }

        function clampSelection(index) {
            if (!state.items.length) return 0;
            if (index < 0) return state.items.length - 1;
            if (index >= state.items.length) return 0;
            return index;
        }

        function setSelected(index, sync) {
            state.selected = clampSelection(index);
            render();

            if (sync) {
                post('tvMenuAction', {
                    action: 'navigate',
                    index: state.selected + 1,
                });
            }
        }

        function closeMenu(notify) {
            state.open = false;
            root.classList.add('hidden');

            if (notify) {
                post('tvMenuClose');
            }
        }

        function selectCurrent() {
            var item = state.items[state.selected];
            if (!item || item.disabled) return;

            post('tvMenuAction', {
                action: 'select',
                index: state.selected + 1,
            });
        }

        function render() {
            if (!state.open) return;

            title.textContent = state.title || defaultBranding.Title;
            itemsContainer.innerHTML = '';

            var selectedItem = state.items[state.selected];
            hint.textContent = selectedItem && selectedItem.description ? selectedItem.description : '';

            state.items.forEach(function(item, index) {
                var button = document.createElement('button');
                button.type = 'button';
                button.className = 'tv-menu-item';

                if (index === state.selected) {
                    button.classList.add('is-selected');
                }

                if (item.disabled) {
                    button.classList.add('is-disabled');
                }

                var main = document.createElement('div');
                main.className = 'tv-menu-item-main';

                if (item.meta) {
                    var meta = document.createElement('div');
                    meta.className = 'tv-menu-item-meta';
                    meta.textContent = item.meta;
                    main.appendChild(meta);
                }

                var label = document.createElement('div');
                label.className = 'tv-menu-item-label';
                label.textContent = item.label;
                main.appendChild(label);

                button.appendChild(main);

                button.addEventListener('mouseenter', function() {
                    setSelected(index, true);
                });

                button.addEventListener('click', function() {
                    setSelected(index, true);
                    selectCurrent();
                });

                itemsContainer.appendChild(button);
            });
        }

        function applyBranding(branding) {
            var resolved = branding || defaultBranding;
            var panelLayout = resolved.Layout && resolved.Layout.Panel ? resolved.Layout.Panel : defaultBranding.Layout.Panel;
            var hintLayout = resolved.Layout && resolved.Layout.Hint ? resolved.Layout.Hint : defaultBranding.Layout.Hint;

            kicker.textContent = resolved.Kicker || defaultBranding.Kicker;
            title.textContent = resolved.Title || defaultBranding.Title;

            panel.style.top = panelLayout.Top || defaultBranding.Layout.Panel.Top;
            panel.style.right = panelLayout.Right || defaultBranding.Layout.Panel.Right;
            panel.style.left = panelLayout.Left || defaultBranding.Layout.Panel.Left;
            panel.style.transform = panelLayout.Transform || defaultBranding.Layout.Panel.Transform;

            hint.style.top = hintLayout.Top || defaultBranding.Layout.Hint.Top;
            hint.style.right = hintLayout.Right || defaultBranding.Layout.Hint.Right;
            hint.style.left = hintLayout.Left || defaultBranding.Layout.Hint.Left;
            hint.style.width = hintLayout.Width || defaultBranding.Layout.Hint.Width;
            hint.style.transform = hintLayout.Transform || defaultBranding.Layout.Hint.Transform;
        }

        window.addEventListener('message', function(event) {
            var message = event.data || {};

            if (message.action === 'ptv:openMenu' || message.action === 'ptv:updateMenu') {
                state.open = true;
                applyBranding(message.data && message.data.branding ? message.data.branding : defaultBranding);
                state.title = message.data && message.data.branding && message.data.branding.Title
                    ? message.data.branding.Title
                    : defaultBranding.Title;
                state.items = message.data && Array.isArray(message.data.items) ? message.data.items : [];
                root.classList.remove('hidden');
                setSelected(((message.data && message.data.selected) || 1) - 1, false);
            }

            if (message.action === 'ptv:closeMenu') {
                closeMenu(false);
            }
        });

        window.addEventListener('keydown', function(event) {
            if (!state.open) return;

            if (event.key === 'ArrowUp') {
                event.preventDefault();
                setSelected(state.selected - 1, true);
                return;
            }

            if (event.key === 'ArrowDown') {
                event.preventDefault();
                setSelected(state.selected + 1, true);
                return;
            }

            if (event.key === 'Enter') {
                event.preventDefault();
                selectCurrent();
                return;
            }

            if (event.key === 'Escape' || event.key === 'Backspace') {
                event.preventDefault();
                closeMenu(true);
            }
        });
    </script>
</body>
</html>
