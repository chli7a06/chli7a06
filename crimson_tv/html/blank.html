<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crimson_tv menu</title>
    <style>
        * { box-sizing: border-box; }
        :root { --panel-width: 300px; --accent: #ff5875; --text-main: #fff; }
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color: var(--text-main); user-select: none; }
        body { font-family: "Segoe UI", Arial, sans-serif; }
        button { font: inherit; }
        #tv-menu-root { position: fixed; inset: 0; }
        #tv-menu-root.hidden { display: none; }
        #tv-menu-panel { position: absolute; top: 66%; right: 8px; left: auto; width: var(--panel-width); max-width: calc(100vw - 16px); transform: translateY(-50%); background: transparent; }
        .tv-menu-header { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 9px 11px; border: 1px solid rgba(255,255,255,.42); border-radius: 30px; background: linear-gradient(120deg, rgba(72,70,76,.96), rgba(34,32,38,.96)); box-shadow: inset 0 1px 2px rgba(255,255,255,.12), 0 5px 16px rgba(0,0,0,.16); }
        .tv-header-icon { width: 25px; height: 25px; color: var(--accent); flex: none; }
        .tv-menu-heading { flex: 1; min-width: 0; }
        .tv-menu-title { font-size: 14px; font-weight: 700; line-height: 1.3; }
        .tv-menu-close { width: 29px; height: 29px; padding: 0; flex: none; border: 1px solid rgba(255,255,255,.4); border-radius: 50%; background: rgba(18,17,22,.45); color: #fff; font-size: 20px; cursor: pointer; }
        .tv-menu-close:hover, .tv-menu-close:focus-visible { border-color: var(--accent); outline: none; background: #713741; }
        .tv-menu-divider { height: 3px; margin: 8px 16px 7px; background: var(--accent); border-radius: 3px; }
        .tv-menu-items { padding: 0 5px; }
        .tv-menu-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 13px; border: 1px solid rgba(255,255,255,.38); border-radius: 30px; color: #fff; background: linear-gradient(110deg, rgba(66,63,70,.95), rgba(31,29,35,.95)); box-shadow: inset 0 1px 1px rgba(255,255,255,.06); text-align: left; cursor: pointer; appearance: none; transition: background 120ms ease, border-color 120ms ease; }
        .tv-menu-item + .tv-menu-item { margin-top: 7px; }
        .tv-menu-item:hover, .tv-menu-item:focus-visible { border-color: var(--accent); outline: none; }
        .tv-menu-item.is-selected { border-color: var(--accent); background: linear-gradient(110deg, rgba(153,59,78,.98), rgba(73,34,44,.98)); }
        .tv-menu-item.is-disabled { opacity: .5; cursor: default; }
        .tv-menu-item-icon { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; flex: none; border: 1px solid rgba(255,88,117,.7); border-radius: 50%; color: #ff718a; background: rgba(255,88,117,.08); }
        svg { display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .tv-menu-item-main { flex: 1; min-width: 0; }
        .tv-menu-item-label { font-size: 13px; font-weight: 600; line-height: 1.3; }
        .tv-menu-item-description { margin-top: 3px; font-size: 10px; line-height: 1.35; color: #f1eaf0; }
        .tv-menu-item-meta { font-size: 9px; color: #d7ced6; }
        .tv-menu-item-arrow { flex: none; color: #ddd3db; font-size: 21px; line-height: 1; }
        .tv-menu-footer { display: flex; align-items: center; gap: 7px; margin: 11px 17px 0; font-size: 10px; letter-spacing: .04em; }
        .tv-menu-footer kbd { padding: 2px 4px; border: 1px solid var(--accent); border-radius: 4px; color: #ff8da1; background: rgba(28,20,27,.85); font: inherit; }
        .tv-menu-hint { display: none; }
    </style>
</head>
<body>
        <div id="tv-menu-root" class="hidden">
            <div id="tv-menu-panel">
                <div class="tv-menu-header">
                    <svg class="tv-header-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="m8 2 4 4 4-4M8 22h8"/></svg>
                    <div class="tv-menu-heading">
                        <div id="tv-menu-title" class="tv-menu-title">CRIMSON TV</div>
                    </div>
                    <button id="tv-menu-close" class="tv-menu-close" type="button" aria-label="Close TV menu">×</button>
                </div>
                <div class="tv-menu-divider"></div>
                <div id="tv-menu-items" class="tv-menu-items"></div>
                <div class="tv-menu-footer"><kbd>ESC</kbd><span>TO CLOSE</span></div>
        </div>
        <div id="tv-menu-hint" class="tv-menu-hint"></div>
    </div>
    <script>
        var root = document.getElementById('tv-menu-root');
        var panel = document.getElementById('tv-menu-panel');
        var title = document.getElementById('tv-menu-title');
        var itemsContainer = document.getElementById('tv-menu-items');
        var hint = document.getElementById('tv-menu-hint');

        var defaultBranding = {
            Title: 'CRIMSON TV',
            Layout: {
                Panel: {
                    Top: '66%',
                    Right: '8px',
                    Left: 'auto',
                    Transform: 'translateY(-50%)',
                },
                Hint: {
                    Top: 'calc(66% + 230px)',
                    Right: '70px',
                    Left: 'auto',
                    Width: '252px',
                    Transform: 'none',
                },
            },
        };

        var state = {
            open: false,
            title: defaultBranding.Title,
            items: [],
            selected: 0,
        };

        var resourceName = 'crimson_tv';

        if (typeof GetParentResourceName === 'function') {
            resourceName = GetParentResourceName();
        }

        function post(eventName, data) {
            fetch('https://' + resourceName + '/' + eventName, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json; charset=UTF-8',
                },
                body: JSON.stringify(data || {}),
            }).catch(function() {});
        }

        function clampSelection(index) {
            if (!state.items.length) return 0;
            if (index < 0) return state.items.length - 1;
            if (index >= state.items.length) return 0;
            return index;
        }

        function setSelected(index, sync) {
            state.selected = clampSelection(index);
            // Keep button nodes alive between pointer-down and pointer-up.
            Array.prototype.forEach.call(itemsContainer.children, function(button, itemIndex) {
                button.classList.toggle('is-selected', itemIndex === state.selected);
            });
            var selectedItem = state.items[state.selected];
            hint.textContent = selectedItem && selectedItem.description ? selectedItem.description : '';

            if (sync) {
                post('tvMenuAction', {
                    action: 'navigate',
                    index: state.selected + 1,
                });
            }
        }

        function closeMenu(notify) {
            state.open = false;
            root.classList.add('hidden');

            if (notify) {
                post('tvMenuClose');
            }
        }

        function selectCurrent() {
            var item = state.items[state.selected];
            if (!item || item.disabled) return;

            post('tvMenuAction', {
                action: 'select',
                index: state.selected + 1,
            });
        }

        function render() {
            if (!state.open) return;

            title.textContent = state.title || defaultBranding.Title;
            itemsContainer.innerHTML = '';

            var selectedItem = state.items[state.selected];
            hint.textContent = selectedItem && selectedItem.description ? selectedItem.description : '';

            state.items.forEach(function(item, index) {
                var button = document.createElement('button');
                button.type = 'button';
                button.className = 'tv-menu-item';

                if (index === state.selected) {
                    button.classList.add('is-selected');
                }

                if (item.disabled) {
                    button.classList.add('is-disabled');
                }

                var main = document.createElement('div');
                main.className = 'tv-menu-item-main';

                if (item.meta) {
                    var meta = document.createElement('div');
                    meta.className = 'tv-menu-item-meta';
                    meta.textContent = item.meta;
                    main.appendChild(meta);
                }

                var label = document.createElement('div');
                label.className = 'tv-menu-item-label';
                label.textContent = item.label;
                main.appendChild(label);

                var icon = document.createElement('span');
                icon.className = 'tv-menu-item-icon';
                icon.setAttribute('aria-hidden', 'true');
                var symbols = [
                    '<path d="m9 6 9 6-9 6z"/>',
                    '<path d="M11 5 6 9H3v6h3l5 4zM15 8c3 2 3 6 0 8M18 5c5 4 5 10 0 14"/>',
                    '<circle cx="12" cy="12" r="3"/><path d="M8 5a8 8 0 0 0 0 14M16 5a8 8 0 0 1 0 14M5 2a12 12 0 0 0 0 20M19 2a12 12 0 0 1 0 20"/>',
                    '<path d="M12 2v10M6 5a9 9 0 1 0 12 0"/>',
                    '<path d="m7 7 10 10M17 7 7 17"/>'
                ];
                icon.innerHTML = '<svg viewBox="0 0 24 24">' + symbols[index % symbols.length] + '</svg>';
                button.appendChild(icon);
                if (item.description) {
                    var description = document.createElement('div');
                    description.className = 'tv-menu-item-description';
                    description.textContent = item.description;
                    main.appendChild(description);
                }
                button.appendChild(main);
                button.disabled = !!item.disabled;
                button.setAttribute('aria-label', item.label || 'TV action');
                var arrow = document.createElement('span');
                arrow.className = 'tv-menu-item-arrow';
                arrow.setAttribute('aria-hidden', 'true');
                arrow.textContent = '›';
                button.appendChild(arrow);

                button.addEventListener('mouseenter', function() {
                    setSelected(index, true);
                });

                button.addEventListener('click', function() {
                    setSelected(index, true);
                    selectCurrent();
                });

                itemsContainer.appendChild(button);
            });
        }

        function applyBranding(branding) {
            var resolved = branding || defaultBranding;
            var panelLayout = resolved.Layout && resolved.Layout.Panel ? resolved.Layout.Panel : defaultBranding.Layout.Panel;
            var hintLayout = resolved.Layout && resolved.Layout.Hint ? resolved.Layout.Hint : defaultBranding.Layout.Hint;

            title.textContent = resolved.Title || defaultBranding.Title;

            panel.style.top = panelLayout.Top || defaultBranding.Layout.Panel.Top;
            panel.style.right = panelLayout.Right || defaultBranding.Layout.Panel.Right;
            panel.style.left = panelLayout.Left || defaultBranding.Layout.Panel.Left;
            panel.style.transform = panelLayout.Transform || defaultBranding.Layout.Panel.Transform;

            hint.style.top = hintLayout.Top || defaultBranding.Layout.Hint.Top;
            hint.style.right = hintLayout.Right || defaultBranding.Layout.Hint.Right;
            hint.style.left = hintLayout.Left || defaultBranding.Layout.Hint.Left;
            hint.style.width = hintLayout.Width || defaultBranding.Layout.Hint.Width;
            hint.style.transform = hintLayout.Transform || defaultBranding.Layout.Hint.Transform;
        }

        document.getElementById('tv-menu-close').addEventListener('click', function() { closeMenu(true); });

        window.addEventListener('message', function(event) {
            var message = event.data || {};

            if (message.action === 'ptv:openMenu' || message.action === 'ptv:updateMenu') {
                state.open = true;
                applyBranding(message.data && message.data.branding ? message.data.branding : defaultBranding);
                state.title = message.data && message.data.branding && message.data.branding.Title
                    ? message.data.branding.Title
                    : defaultBranding.Title;
                state.items = message.data && Array.isArray(message.data.items) ? message.data.items : [];
                root.classList.remove('hidden');
                render();
                setSelected(((message.data && message.data.selected) || 1) - 1, false);
            }

            if (message.action === 'ptv:closeMenu') {
                closeMenu(false);
            }
        });

        window.addEventListener('keydown', function(event) {
            if (!state.open) return;

            if (event.key === 'ArrowUp') {
                event.preventDefault();
                setSelected(state.selected - 1, true);
                return;
            }

            if (event.key === 'ArrowDown') {
                event.preventDefault();
                setSelected(state.selected + 1, true);
                return;
            }

            if (event.key === 'Enter') {
                event.preventDefault();
                selectCurrent();
                return;
            }

            if (event.key === 'Escape' || event.key === 'Backspace') {
                event.preventDefault();
                closeMenu(true);
            }
        });
    </script>
</body>
</html>
