<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crimson MDT</title><link rel="stylesheet" href="style.css"></head><body>
<main id="tablet" hidden><aside><div class="brand"><img src="crimson-logo.png" alt="Crimson RP"><div><strong>CRIMSON<span>MDT</span></strong><small id="dept">Department of Justice</small></div></div><div class="operator"><span class="avatar">C</span><div><b id="name"></b><small id="job"></small></div><i id="duty-dot"></i></div><nav id="nav" aria-label="Modules"></nav><div class="sidebar-bottom"><button id="duty">Go on duty</button><button id="close">⏻ Close tablet <kbd>Esc</kbd></button><small>CRIMSON SYSTEMS · 2.0 PREVIEW</small></div></aside>
<section class="workspace"><header><div><small id="breadcrumb">CRIMSON / OVERVIEW</small><h1 id="heading">Dashboard</h1><p id="subtitle"></p></div><div class="top-tools"><span id="clock"></span><span class="badge" id="code">CODE GREEN</span><button id="refresh" title="Refresh">↻</button></div></header><div id="message" role="status" aria-live="polite" hidden></div><div id="content"></div><footer><span id="identity"></span><span>QBOX · CRIMSON MDT</span></footer></section></main>
<dialog id="editor"><form id="edit-form"><div class="dialog-header"><div><small>CRIMSON RECORDS</small><h2 id="editor-title">New record</h2></div><button id="cancel-x" type="button" aria-label="Close editor">×</button></div><div id="editor-message" class="dialog-error" role="status" hidden></div><div id="editor-fields"></div><div class="dialog-actions"><button id="cancel" type="button">Cancel</button><button id="save" type="submit" class="primary">Save record</button></div></form></dialog>
<script src="app.js"></script></body></html>
